name: Merge Notebooks

on:
  push:
    branches:
      - '**'

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY_MAIN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt "nbconvert[webpdf]"
          playwright install chromium --with-deps

      - name: Run merge script
        run: python scripts/merge_notebooks.py

      # On feature branches the run is validation-only — execute the notebooks
      # to confirm they run end-to-end, but don't save/commit the artifacts.
      - name: Commit artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/Final-Project-Report-Team-3.ipynb artifacts/Final-Project-Report-Team-3.pdf
          if git diff --cached --quiet; then
            echo "No changes to artifacts — skipping commit."
          else
            git commit -m "chore: regenerate Final-Project-Report-Team-3.ipynb and .pdf [skip ci]"
            git push
          fi
